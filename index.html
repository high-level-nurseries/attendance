<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EC4899">
<meta name="robots" content="noindex, nofollow">
<title>حضانات هاي ليفيل — الحضور والانصراف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--pink:#EC4899;--pink-d:#DB2777;--blue:#38BDF8;--blue-d:#0EA5E9;--amber:#F59E0B;--green:#10B981;--red:#EF4444;--ink:#1F2937;--muted:#6B7280;--line:#E5E7EB;--bg:#FDF2F8;--card:#FFFFFF;--radius:18px;--shadow:0 6px 24px rgba(236,72,153,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Tajawal","Segoe UI",Tahoma,system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.7}
.boot{text-align:center;padding:90px 20px;color:var(--pink)}
.boot img{width:120px;height:120px;border-radius:50%}
.wrap{max-width:1080px;margin:0 auto;padding:18px}
.center-wrap{max-width:460px;margin:0 auto;padding:24px 18px 60px}
.landing{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 20% 20%,rgba(236,72,153,.16),transparent 45%),radial-gradient(circle at 82% 78%,rgba(56,189,248,.18),transparent 45%),var(--bg);padding:30px 18px}
.logo{border-radius:50%;object-fit:cover;background:#fff}
.landing .logo{width:168px;height:168px;filter:drop-shadow(0 8px 22px rgba(236,72,153,.25))}
.landing h1{font-size:28px;margin:14px 0 2px;color:var(--pink-d)}
.landing .sub{color:var(--muted);margin-bottom:18px;font-size:15px}
.landing .badges{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:22px}
.badge-soft{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--muted)}
.badge-soft i{color:var(--blue-d);margin-inline-end:6px}
.login-card{width:100%;max-width:380px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px;border:1px solid rgba(236,72,153,.06)}
.card h2{margin:0 0 4px;font-size:19px}
.card h3{margin:0 0 12px;font-size:16px}
.muted{color:var(--muted);font-size:14px}.tiny{font-size:12.5px;color:var(--muted)}
label{display:block;font-size:14px;margin:12px 0 5px;font-weight:700}
input,select,textarea{width:100%;padding:12px 14px;font-size:15px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-family:inherit;color:var(--ink);outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(236,72,153,.12)}
input[type=number],input[type=tel].ltr,input.ltr{direction:ltr;text-align:left}
input[type=checkbox]{width:auto}
.pin-input{text-align:center;letter-spacing:14px;font-size:30px;font-weight:800;padding:14px;direction:ltr}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;border:none;cursor:pointer;font-size:15px;font-weight:700;font-family:inherit;transition:.15s;background:var(--pink);color:#fff;width:100%;text-decoration:none}
.btn:hover{background:var(--pink-d)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.blue{background:var(--blue-d)}.btn.blue:hover{background:#0284C7}
.btn.green{background:var(--green)}.btn.green:hover{background:#059669}
.btn.red,.btn.danger{background:var(--red)}.btn.red:hover,.btn.danger:hover{background:#DC2626}
.btn.amber{background:var(--amber)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}.btn.ghost:hover{background:#F9FAFB;border-color:var(--pink)}
.btn.sm{padding:7px 11px;font-size:13px;width:auto;border-radius:10px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
td .btn-row{flex-wrap:nowrap}.btn-row .btn{width:auto}
.topbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:900}
.topbar-in{max-width:1080px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
.topbar img{width:44px;height:44px}
.topbar .tt{flex:1;min-width:0}
.topbar .tt b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .tt span{font-size:12.5px;color:var(--muted)}
.role-chip{font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(236,72,153,.12);color:var(--pink-d);font-weight:700;white-space:nowrap}
.role-chip.supervisor{background:rgba(56,189,248,.15);color:#0284C7}
.role-chip.developer{background:rgba(245,158,11,.15);color:#B45309}
.role-chip.manager{background:rgba(124,58,237,.12);color:#6D28D9}
.role-chip.board{background:rgba(16,185,129,.14);color:#047857}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:9px 15px;border-radius:999px;background:#fff;border:1.5px solid var(--line);cursor:pointer;font-size:14px;font-weight:700;color:var(--muted);font-family:inherit;white-space:nowrap}
.tab.active{background:var(--pink);color:#fff;border-color:var(--pink)}
.tab .cnt{background:var(--red);color:#fff;border-radius:999px;padding:0 7px;font-size:11px;margin-inline-start:4px}
.att-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.att-btn{border-radius:var(--radius);padding:26px 14px;text-align:center;cursor:pointer;border:2px solid transparent;color:#fff;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:var(--shadow);transition:.15s}
.att-btn i{font-size:38px}.att-btn b{font-size:17px}.att-btn small{opacity:.92;font-size:12.5px}
.att-btn.in{background:linear-gradient(150deg,#10B981,#059669)}
.att-btn.out{background:linear-gradient(150deg,#F59E0B,#D97706)}
.att-btn:active{transform:scale(.97)}
.att-btn:disabled{opacity:.38;filter:grayscale(.5);cursor:not-allowed}
.status-pill{display:inline-flex;align-items:center;gap:8px;padding:7px 15px;border-radius:999px;font-weight:700;font-size:14px}
.status-pill.in{background:rgba(16,185,129,.14);color:#047857}
.status-pill.out{background:rgba(107,114,128,.14);color:#4B5563}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:#FDF2F8;color:var(--pink-d);font-size:12.5px;font-weight:800;position:sticky;top:0}
tr:last-child td{border-bottom:none}
td.ltr{direction:ltr;text-align:left;font-size:12px}
.pill{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;display:inline-block}
.pill.ok{background:rgba(16,185,129,.14);color:#047857}
.pill.no{background:rgba(239,68,68,.12);color:#B91C1C}
.pill.wait{background:rgba(245,158,11,.15);color:#B45309}
.pill.info{background:rgba(56,189,248,.15);color:#0284C7}
.pill.grey{background:#F3F4F6;color:#6B7280}
.att-table td{padding:11px 12px}
.tm{display:inline-block;padding:4px 12px;border-radius:10px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;direction:ltr;letter-spacing:.5px}
.tm.ontime{background:rgba(16,185,129,.16);color:#047857;box-shadow:inset 0 0 0 1.5px rgba(16,185,129,.35)}
.tm.late{background:rgba(239,68,68,.14);color:#B91C1C;box-shadow:inset 0 0 0 1.5px rgba(239,68,68,.35)}
.tm.out{background:rgba(245,158,11,.16);color:#B45309;box-shadow:inset 0 0 0 1.5px rgba(245,158,11,.40)}
.tm.no{background:rgba(107,114,128,.10);color:#9CA3AF;font-size:13px;font-weight:600}
.sub-note{display:block;font-size:11.5px;font-weight:700;margin-top:3px}
.sub-note.r{color:#B91C1C}.sub-note.o{color:#B45309}
.legend{display:flex;flex-wrap:wrap;gap:14px;align-items:center;background:#fff;border-radius:14px;padding:10px 16px;box-shadow:var(--shadow);font-size:12.5px;color:var(--muted);margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .dot{width:12px;height:12px;border-radius:4px;display:inline-block}
.dot.g{background:rgba(16,185,129,.55)}.dot.r{background:rgba(239,68,68,.55)}.dot.o{background:rgba(245,158,11,.6)}.dot.n{background:rgba(107,114,128,.3)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border-radius:14px;padding:16px;box-shadow:var(--shadow);text-align:center}
.stat i{font-size:22px;color:var(--pink)}.stat b{display:block;font-size:26px;margin:4px 0 0}.stat span{font-size:12.5px;color:var(--muted)}
.stat.click{cursor:pointer}
.modal-bg{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:1000;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.modal{background:#fff;width:100%;max-width:580px;border-radius:20px 20px 0 0;padding:20px;max-height:92vh;overflow-y:auto;animation:up .2s ease}
@media(min-width:700px){.modal-bg{align-items:center}.modal{border-radius:20px}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.modal h3{margin:0 0 10px;font-size:18px}
.modal-close{float:left;background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted)}
#map{height:320px;border-radius:14px;margin-top:10px;z-index:1}
#toast-wrap{position:fixed;bottom:20px;left:0;right:0;z-index:2000;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:#1F2937;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;max-width:90%;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .2s ease;display:flex;align-items:center;gap:8px}
.toast.ok{background:#059669}.toast.err{background:#DC2626}.toast.warn{background:#D97706}
@keyframes tin{from{transform:translateY(12px);opacity:0}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.flex-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.divider{height:1px;background:var(--line);margin:16px 0}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.empty i{font-size:34px;color:#E5E7EB;display:block;margin-bottom:10px}
.loading{text-align:center;padding:30px;color:var(--muted)}
.chip-list{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#F3F4F6;border-radius:999px;padding:4px 12px;font-size:12.5px}
.chip .x{cursor:pointer;color:var(--red);margin-inline-start:6px}
.checklist label{display:flex;align-items:center;gap:8px;font-weight:500;padding:7px 0;border-bottom:1px solid var(--line);margin:0}
.hint-box{background:#FFF7ED;border:1px solid #FED7AA;color:#9A3412;border-radius:12px;padding:12px;font-size:14px}
.ok-box{background:#ECFDF5;border:1px solid #A7F3D0;color:#065F46;border-radius:12px;padding:12px;font-size:14px}
.err-box{background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;border-radius:12px;padding:12px;font-size:14px}
.info-box{background:#F0F9FF;border:1px solid #BAE6FD;color:#075985;border-radius:12px;padding:12px;font-size:14px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.filters label{margin-top:0}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loc{display:flex;gap:10px;align-items:flex-start}
.loc i{font-size:22px;margin-top:3px}
.branch-card{border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:20px 0 30px}
@media(max-width:560px){.att-btn{padding:20px 8px}.att-btn i{font-size:30px}.landing .logo{width:140px;height:140px}.grid2{grid-template-columns:1fr}.grid4{grid-template-columns:1fr 1fr}.wrap{padding:12px}.topbar-in{padding:8px 12px}}
</style>
</head>
<body>
<div id="app"><div class="boot"><i class="fa-solid fa-circle-notch fa-spin fa-2x"></i></div></div>
<div id="toast-wrap"></div>
<script>
'use strict';
/* =================== الإعداد =================== */
var API_URL = 'https://script.google.com/macros/s/AKfycbzXx5K-YOGN4JVeJKLlJk6w2FDax5CMmdPhFy5Ugk5ZrYWV1xwWlJ9p15iMwVloUl-7-A/exec';
var LS = { token: 'hl_att_token', device: 'hl_att_device', logo: 'hl_att_logo_v1', org: 'hl_att_org', me: 'hl_att_me' };
var S = { token: null, me: null, cfg: null, admin: null, tab: null, branch: '', logo: '' };
var ROLE_AR = { employee: 'موظفة', supervisor: 'مشرفة', board: 'عضو مجلس الإدارة', manager: 'المدير التنفيذي', developer: 'المطوّر' };

/* =================== أدوات =================== */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
function toArabicSafeDigits(s) {
  return String(s || '').replace(/[٠-٩]/g, function (c) { return String(c.charCodeAt(0) - 0x0660); })
    .replace(/[۰-۹]/g, function (c) { return String(c.charCodeAt(0) - 0x06F0); });
}
function toast(msg, kind) {
  var t = document.createElement('div');
  t.className = 'toast ' + (kind || '');
  var ic = kind === 'ok' ? 'fa-circle-check' : kind === 'err' ? 'fa-circle-exclamation' : kind === 'warn' ? 'fa-triangle-exclamation' : 'fa-circle-info';
  t.innerHTML = '<i class="fa-solid ' + ic + '"></i><span>' + esc(msg) + '</span>';
  $('toast-wrap').appendChild(t);
  setTimeout(function () { t.style.opacity = '0'; t.style.transition = '.3s'; }, 4200);
  setTimeout(function () { t.remove(); }, 4600);
}
function cookieGet(k) { try { var m = document.cookie.match(new RegExp('(?:^|; )' + k + '=([^;]*)')); return m ? decodeURIComponent(m[1]) : null; } catch (e) { return null; } }
function cookieSet(k, v) { try { document.cookie = k + '=' + encodeURIComponent(v) + '; max-age=34560000; path=/; SameSite=Lax; Secure'; } catch (e) {} }
/** معرّف الجهاز: يُحفظ في localStorage والكوكيز معًا حتى لا يضيع بسهولة. */
function getDeviceId() {
  var ok = function (x) { return x && /^[A-Za-z0-9_-]{16,64}$/.test(x); };
  var d = lsGet(LS.device);
  if (!ok(d)) d = cookieGet('hl_dev');
  if (!ok(d)) {
    var a = new Uint8Array(18);
    (window.crypto || window.msCrypto).getRandomValues(a);
    d = Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
  }
  lsSet(LS.device, d); cookieSet('hl_dev', d);
  return d;
}
/** بصمة الجهاز (خصائص ثابتة للجوال) — تتعرّف على نفس الجوال لو مسح المتصفح ذاكرته (التصفح الخاص). */
var fpPromise = null;
function getFingerprint() {
  if (fpPromise) return fpPromise;
  var parts = [navigator.userAgent, screen.width + 'x' + screen.height, window.devicePixelRatio, screen.colorDepth,
    (Intl.DateTimeFormat().resolvedOptions().timeZone || ''), navigator.language, (navigator.languages || []).join(','),
    navigator.hardwareConcurrency || '', navigator.maxTouchPoints || 0, navigator.platform || ''];
  try {
    var c = document.createElement('canvas'), gl = c.getContext('webgl') || c.getContext('experimental-webgl');
    if (gl) { var ext = gl.getExtension('WEBGL_debug_renderer_info'); parts.push(ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)); }
  } catch (e) {}
  var txt = parts.join('|');
  fpPromise = (window.crypto && crypto.subtle ? crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt)).then(function (b) {
    return Array.prototype.map.call(new Uint8Array(b), function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
  }) : Promise.resolve('')).catch(function () { return ''; });
  return fpPromise;
}
/** ASCII فقط في الطلب حتى لا يتغير ترميز العربي. */
function asciiJson(v) { return JSON.stringify(v).replace(/[\u007f-￿]/g, function (c) { return '\\u' + ('0000' + c.charCodeAt(0).toString(16)).slice(-4); }); }
function api(action, args) {
  var body = asciiJson({ action: action, token: S.token || '', args: args || {} });
  var ctrl = window.AbortController ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 45000) : null;
  return fetch(API_URL, { method: 'POST', body: body, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow', credentials: 'omit', cache: 'no-store', signal: ctrl ? ctrl.signal : undefined })
    .then(function (r) { if (!r.ok) throw new Error('net'); return r.text(); })
    .then(function (txt) {
      if (timer) clearTimeout(timer);
      var res; try { res = JSON.parse(txt); } catch (e) { throw new Error('تعذّر الاتصال بالنظام، حاولي مرة ثانية'); }
      if (!res.ok) {
        if (res.code === 'auth') { logoutLocal(); renderLanding(res.error); }
        var err = new Error(res.error || 'خطأ'); err.code = res.code; throw err;
      }
      return res.data;
    }, function (e) {
      if (timer) clearTimeout(timer);
      if (e && e.code) throw e;
      throw new Error(navigator.onLine === false ? 'لا يوجد اتصال بالإنترنت' : 'تعذّر الاتصال بالنظام، حاولي مرة ثانية');
    });
}
function busy(btn, on, label) {
  if (!btn) return;
  if (on) { btn.dataset.html = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span> ' + (label || 'لحظة…'); }
  else { btn.disabled = false; if (btn.dataset.html) btn.innerHTML = btn.dataset.html; }
}
function getPosition() {
  return new Promise(function (resolve, reject) {
    if (!navigator.geolocation) return reject(new Error('المتصفح لا يدعم تحديد الموقع'));
    navigator.geolocation.getCurrentPosition(function (p) { resolve(p.coords); }, function (err) {
      var m = { 1: 'لازم تسمحين للصفحة باستخدام الموقع (من إعدادات المتصفح ← الموقع ← سماح)', 2: 'تعذّر تحديد موقعك. تأكدي إن خدمة الموقع (GPS) شغالة', 3: 'تأخر تحديد الموقع، حاولي مرة ثانية' };
      reject(new Error(m[err.code] || 'تعذّر تحديد الموقع'));
    }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  });
}
function logoHtml(cls, size) { return '<img class="logo ' + (cls || '') + '" src="' + esc(S.logo || '') + '" alt="الشعار" width="' + size + '" height="' + size + '">'; }
function loadLogo() {
  S.logo = lsGet(LS.logo) || '';
  if (S.logo) return Promise.resolve();
  return api('logo').then(function (d) { if (d && /^data:image\//.test(d)) { S.logo = d; lsSet(LS.logo, d); document.querySelectorAll('img.logo').forEach(function (i) { i.src = d; }); } }).catch(function () {});
}
function closeModal() { var m = $('modal-bg'); if (m) m.remove(); }
function openModal(title, html, opts) {
  closeModal();
  var bg = document.createElement('div');
  bg.className = 'modal-bg'; bg.id = 'modal-bg';
  bg.innerHTML = '<div class="modal" role="dialog"><button class="modal-close" aria-label="إغلاق">&times;</button><h3>' + esc(title) + '</h3><div id="modal-body">' + html + '</div></div>';
  bg.querySelector('.modal-close').onclick = closeModal;
  bg.addEventListener('click', function (e) { if (e.target === bg && !(opts && opts.sticky)) closeModal(); });
  document.body.appendChild(bg);
  return bg;
}
function confirmBox(text, opts) {
  opts = opts || {};
  return new Promise(function (resolve) {
    var typed = opts.typed ? '<label>اكتبي «' + esc(opts.typed) + '» للتأكيد</label><input id="cf-typed" autocomplete="off">' : '';

      '<div class="btn-row" style="margin-top:14px"><button class="btn ' + (opts.danger ? 'danger' : '') + '" id="cf-yes">' + esc(opts.yes || 'تأكيد') + '</button><button class="btn ghost" id="cf-no">إلغاء</button></div>', { sticky: true });

    var v = toArabicSafeDigits(pin.value).replace(/\D/g, '').slice(0, 4);
    if (pin.value !== v) pin.value = v;

var loginBusy = false;
function doLogin() {
  if (loginBusy) return;
  var pin = toArabicSafeDigits($('pin').value).replace(/\D/g, '');
  if (pin.length !== 4) { $('login-msg').innerHTML = '<div class="hint-box">الرقم السري ٤ أرقام</div>'; return; }
  loginBusy = true;
  var btn = $('login-btn'); busy(btn, true, 'جارٍ الدخول…');
  getFingerprint().then(function (fp) {
    return api('login', { pin: pin, deviceId: getDeviceId(), ua: navigator.userAgent, fp: fp });
  }).then(function (d) {
    loginBusy = false;
    if (d.pending) {
      busy(btn, false); $('pin').value = '';
      $('login-msg').innerHTML = '<div class="info-box"><b>أهلًا ' + esc(d.name) + '</b><br>هذا جهاز جديد، وتم إرسال طلب ربطه ' + (d.role === 'employee' ? 'للمشرفة' : 'للإدارة') + '. بعد الموافقة، ادخل/ي من جديد من نفس الجهاز.</div>';
      return;
    }
    S.token = d.token; lsSet(LS.token, d.token);
    S.me = { name: d.name, role: d.role }; lsSet(LS.me, JSON.stringify(S.me));
    S.init = d.init || null;
    route();
  }).catch(function (e) {
    loginBusy = false; busy(btn, false); $('pin').value = '';
    $('login-msg').innerHTML = '<div class="err-box">' + esc(e.message) + '</div>';
    $('pin').focus();
  });
}

  api('me').then(function (me) { S.me = me; lsSet(LS.me, JSON.stringify({ name: me.name, role: me.role })); route(); }).catch(function (e) { if (e.code !== 'auth') { $('app').innerHTML = '<div class="center-wrap"><div class="err-box">' + esc(e.message) + '</div><button class="btn" style="margin-top:12px" onclick="location.reload()">إعادة المحاولة</button></div>'; } });

/** بطاقة البصمة (تُستخدم للموظفة ولتبويب «بصمتي»). */
function mountPunch(el, greet) {

      (s.zones.length ? '<div class="chip-list" style="margin-top:10px">' + s.zones.map(function (z) { return '<span class="chip"><i class="fa-solid fa-location-dot" style="color:var(--pink)"></i> ' + esc(z) + '</span>'; }).join('') + '</div>' : '') +
      '</div>' +
      '<div class="card"><div id="loc-box"></div>' +
      '<div class="att-grid" style="margin-top:14px">' +
      '<button class="att-btn in" id="btn-in"><i class="fa-solid fa-fingerprint"></i><b>بصمة دخول</b><small>تسجيل الحضور</small></button>' +
      '<button class="att-btn out" id="btn-out"><i class="fa-solid fa-person-walking-arrow-right"></i><b>بصمة انصراف</b><small>تسجيل الانصراف</small></button>' +
      '</div><div id="punch-result" style="margin-top:12px"></div>' +
      '<div class="divider"></div><div class="tiny" style="margin-bottom:6px">بصمات اليوم</div><div class="chip-list">' + todayList + '</div></div>';
    $('btn-in').onclick = function () { punch('in', this); };

  function drawLoc(r, err) {
    var box = $('loc-box'); if (!box) return;

    if (r.inside) box.innerHTML = '<div class="ok-box loc"><i class="fa-solid fa-location-dot"></i><div><b>أنتِ داخل النطاق</b> — ' + esc(r.zoneName) + '<div class="tiny">تبعدين ' + r.distance + ' م عن المركز (المسموح ' + r.radius + ' م)</div></div></div>';
    else box.innerHTML = '<div class="hint-box loc"><i class="fa-solid fa-location-dot"></i><div><b>أنتِ خارج النطاق</b> — تبعدين ' + r.distance + ' م عن ' + esc(r.zoneName) + ' (المسموح ' + r.radius + ' م)' + (st.allow ? '<br>البصمة من خارج النطاق مسموحة حاليًا.' : '<br>الأزرار تنفتح أول ما تكونين داخل الحضانة.') + '<div style="margin-top:8px"><button class="btn sm ghost" id="loc-retry"><i class="fa-solid fa-rotate"></i> تحديث الموقع</button></div></div></div>';

    }).then(function (r) {

  }
  var ini = S.init && S.init.todayPunches ? S.init : null; S.init = null;

function dayCells(d) {

  if (d.in) inC = '<span class="tm ' + (d.in.late > 0 ? 'late' : 'ontime') + '">' + esc(d.in.time) + '</span>' + (d.in.manual ? man : '') + (d.in.late > 0 ? '<span class="sub-note r">متأخر ' + d.in.late + ' د</span>' : '') + (d.inCount > 1 ? '<span class="tiny"> (' + d.inCount + ')</span>' : '');
  else inC = '<span class="tm no">— لم يبصم</span>';
  if (d.out) outC = '<span class="tm out">' + esc(d.out.time) + '</span>' + (d.out.manual ? man : '') + (d.out.early > 0 ? '<span class="sub-note o">مبكر ' + d.out.early + ' د</span>' : '') + (d.outCount > 1 ? '<span class="tiny"> (' + d.outCount + ')</span>' : '');
  else outC = '<span class="tm no">— لم يبصم</span>';

  var locC = p && p.manual ? '<span class="pill grey">إدخال يدوي</span>' : p ? (p.inside ? '<span class="pill ok"><i class="fa-solid fa-location-dot"></i> ' + esc(p.zone) + '</span>' : '<span class="pill no">خارج النطاق (' + p.distance + ' م)</span>') : '—';
  var stC = d.status === 'ontime' ? '<span class="pill ok">مكتمل في الوقت</span>' : d.status === 'late' ? '<span class="pill no">متأخر ' + d.in.late + ' د</span>' : d.status === 'early' ? '<span class="pill wait">انصراف مبكر ' + d.out.early + ' د</span>' : '<span class="pill grey">غير مكتمل</span>';
  return { inC: inC, outC: outC, locC: locC, stC: stC };
}

/* ----- الصلاحيات (المطوّر فقط) ----- */
function tabPermissions(el) {
  api('permissions').then(function (d) {
    var vals = JSON.parse(JSON.stringify(d.current));
    function seeKey(k) { return /^(view_|scope_all|export|punch_self)/.test(k); }
    function draw() {
      var groups = [], byG = {};
      d.perms.forEach(function (p) { if (!byG[p.group]) { byG[p.group] = []; groups.push(p.group); } byG[p.group].push(p); });
      var cols = d.roles.length + 2;
      var head = '<thead><tr><th style="white-space:normal">الصلاحية</th>' + d.roles.map(function (r) { return '<th style="text-align:center"><span class="role-chip ' + r.key + '">' + esc(r.label) + '</span></th>'; }).join('') + '<th style="text-align:center"><span class="role-chip developer">المطوّر 🔒</span></th></tr></thead>';
      var body = groups.map(function (g) {
        return '<tr><td colspan="' + cols + '" style="background:#F9FAFB;font-weight:800;color:var(--pink-d)">' + esc(g) + '</td></tr>' + byG[g].map(function (p) {
          return '<tr><td style="white-space:normal;min-width:200px">' + esc(p.label) + '</td>' + d.roles.map(function (r) {
            return '<td style="text-align:center"><input type="checkbox" style="width:20px;height:20px;accent-color:#EC4899;cursor:pointer" data-r="' + r.key + '" data-k="' + p.key + '"' + (vals[r.key][p.key] ? ' checked' : '') + ' aria-label="' + esc(r.label + ' — ' + p.label) + '"></td>';
          }).join('') + '<td style="text-align:center;color:#10B981;font-weight:800">✓</td></tr>';
        }).join('');
      }).join('') +
        '<tr><td colspan="' + cols + '" style="background:#FEF2F2;font-weight:800;color:#B91C1C">للمطوّر فقط (مقفلة)</td></tr>' +
        d.devOnly.map(function (t) { return '<tr><td style="white-space:normal">' + esc(t) + '</td>' + d.roles.map(function () { return '<td style="text-align:center;color:#9CA3AF">🔒</td>'; }).join('') + '<td style="text-align:center;color:#10B981;font-weight:800">✓</td></tr>'; }).join('');
      var summary = d.roles.map(function (r) {
        var on = d.perms.filter(function (p) { return vals[r.key][p.key] && p.key !== 'scope_all'; });
        var see = on.filter(function (p) { return seeKey(p.key); }).map(function (p) { return p.label; });
        var act = on.filter(function (p) { return !seeKey(p.key); }).map(function (p) { return p.label; });
        return '<div class="branch-card"><span class="role-chip ' + r.key + '">' + esc(r.label) + '</span> <span class="tiny">' + (vals[r.key].scope_all ? 'كل الفروع' : 'فرعه فقط') + '</span>' +
          '<div style="margin-top:8px;font-size:13.5px"><b style="color:#0284C7">يشوف:</b> ' + (see.length ? see.map(esc).join('، ') : 'لا شيء') + '</div>' +
          '<div style="margin-top:4px;font-size:13.5px"><b style="color:#047857">يقدر يضيف ويعدّل:</b> ' + (act.length ? act.map(esc).join('، ') : 'لا شيء') + '</div></div>';
      }).join('') + '<div class="branch-card"><span class="role-chip">موظفة</span> <span class="tiny">ثابت</span><div style="margin-top:8px;font-size:13.5px">' + d.employee.map(esc).join('، ') + '</div></div>';
      el.innerHTML = '<div class="info-box" style="margin-bottom:14px"><i class="fa-solid fa-user-shield"></i> حدّد لكل دور وش يشوف ووش يقدر يسوي، واضغط «حفظ الصلاحيات». التغيير ينطبق مباشرة على النظام، ومن كانت فاتحة الصفحة تشوف التغيير لما تحدّثها.</div>' +
        '<div class="card"><h3>ملخص كل دور</h3>' + summary + '</div>' +
        '<div class="card" style="padding:12px"><div class="table-wrap"><table>' + head + '<tbody>' + body + '</tbody></table></div>' +
        '<div class="btn-row" style="margin-top:14px"><button class="btn" id="pm-save" style="width:auto"><i class="fa-solid fa-floppy-disk"></i> حفظ الصلاحيات</button><button class="btn ghost" id="pm-def" style="width:auto"><i class="fa-solid fa-rotate-left"></i> استرجاع الافتراضي</button></div></div>';
      el.querySelectorAll('input[data-r]').forEach(function (c) { c.onchange = function () { vals[c.dataset.r][c.dataset.k] = c.checked; var y = window.scrollY; draw(); window.scrollTo(0, y); }; });
      $('pm-def').onclick = function () { vals = JSON.parse(JSON.stringify(d.defaults)); draw(); toast('رجعت القيم الافتراضية — اضغط «حفظ الصلاحيات» لتطبيقها', 'warn'); };
      $('pm-save').onclick = function () { var b = this; busy(b, true); api('savePermissions', { values: vals }).then(function () { busy(b, false); d.current = JSON.parse(JSON.stringify(vals)); toast('تم حفظ الصلاحيات', 'ok'); }).catch(function (e) { busy(b, false); toast(e.message, 'err'); }); };
    }
    draw();
  }).catch(failBox(el));
}

          } else if (isDev() && e.archived) acts = '<button class="btn sm green" data-a="restore" data-id="' + e.id + '">استرجاع</button>';

/** إدخال حضور سابق (للمطوّر): دخول وانصراف يومي ضمن الدوام بدون تأخير، مُعلَّم «يدوي». */
function backfillForm(e) {
  var y = new Date(today() + 'T00:00:00Z'); y.setUTCDate(y.getUTCDate() - 1);
  var yest = y.toISOString().slice(0, 10);
  var names = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
  openModal('إدخال حضور سابق — ' + e.name,
    '<div class="info-box" style="margin-bottom:10px">النظام يضيف لكل يوم دوام دخول وانصراف بأوقات طبيعية متفاوتة داخل وقت السماح (بدون تأخير ولا انصراف مبكر) حسب دوامها — دوامها الخاص إذا محدد لها، وإلا دوام فرعها. الأيام اللي فيها بصمات ما يلمسها. وكل هالبصمات تنعلّم «إدخال يدوي» في السجل والتصدير.</div>' +
    '<div class="grid2"><div><label>من</label><input type="date" id="bf-from" value="' + monthStart() + '" max="' + yest + '"></div><div><label>إلى</label><input type="date" id="bf-to" value="' + yest + '" max="' + yest + '"></div></div>' +
    '<label>أيام الدوام</label><div class="chip-list">' + names.map(function (n, i) { return '<label class="chip" style="display:inline-flex;gap:6px;align-items:center;margin:0;font-weight:500"><input type="checkbox" class="bf-day" value="' + i + '"' + (i <= 4 ? ' checked' : '') + '> ' + n + '</label>'; }).join('') + '</div>' +
    '<div id="bf-prev" style="margin-top:12px"></div>' +
    '<div class="btn-row" style="margin-top:14px"><button class="btn ghost" id="bf-check" style="width:auto"><i class="fa-solid fa-eye"></i> معاينة</button><button class="btn" id="bf-go" style="width:auto" disabled><i class="fa-solid fa-calendar-plus"></i> إدخال</button></div>' +
    '<div class="divider"></div><button class="btn sm danger" id="bf-del"><i class="fa-solid fa-trash"></i> حذف كل الإدخالات اليدوية لهذه الموظفة</button>');
  function args() { return { employee_id: e.id, from: $('bf-from').value, to: $('bf-to').value, days: Array.prototype.map.call(document.querySelectorAll('.bf-day:checked'), function (c) { return Number(c.value); }) }; }
  function reset() { $('bf-go').disabled = true; $('bf-prev').innerHTML = ''; }
  ['bf-from', 'bf-to'].forEach(function (id) { $(id).onchange = reset; });
  document.querySelectorAll('.bf-day').forEach(function (c) { c.onchange = reset; });
  $('bf-check').onclick = function () {
    var b = this; busy(b, true);
    api('backfillPreview', args()).then(function (r) {
      busy(b, false);
      $('bf-prev').innerHTML = r.days ? '<div class="ok-box">بيضاف <b>' + r.days + '</b> يوم (من ' + fmtDate(r.first) + ' إلى ' + fmtDate(r.last) + ')، دخول حول ' + esc(r.start) + ' وانصراف بعد ' + esc(r.end) + (r.own ? ' (دوامها الخاص)' : ' (دوام الفرع)') + '.' + (r.skipped ? '<br>بيتخطّى ' + r.skipped + ' يوم فيه بصمات من قبل.' : '') + '</div>' : '<div class="hint-box">ما في أيام تنضاف' + (r.skipped ? ' (كل الأيام فيها بصمات)' : '') + '.</div>';
      $('bf-go').disabled = !r.days;
    }).catch(function (x) { busy(b, false); $('bf-prev').innerHTML = '<div class="err-box">' + esc(x.message) + '</div>'; });
  };
  $('bf-go').onclick = function () {
    var b = this; busy(b, true, 'جارٍ الإدخال…');
    api('backfillAttendance', args()).then(function (r) { closeModal(); toast('تم إدخال ' + r.days + ' يوم (' + r.added + ' بصمة)', 'ok'); }).catch(function (x) { busy(b, false); toast(x.message, 'err'); });
  };
  $('bf-del').onclick = function () {
    confirmBox('حذف كل الإدخالات اليدوية لـ ' + e.name + '؟ بصمات الجوال ما تنحذف.', { danger: true, yes: 'حذف' }).then(function (ok) {
      if (ok) api('deleteAttendance', { mode: 'emp_manual', employee_id: e.id }).then(function (r) { toast('تم حذف ' + r.deleted + ' بصمة يدوية', 'ok'); }).catch(function (x) { toast(x.message, 'err'); });
    });
  };
}
/** دوام خاص لموظفة — فاضي يرجعها لدوام فرعها. */

/* ----- الخريطة (Leaflet) ----- */
var leafletReady = null;
function loadLeaflet() {
  if (leafletReady) return leafletReady;
  leafletReady = new Promise(function (resolve, reject) {
    var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'; document.head.appendChild(l);
    var s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
    s.onload = function () { resolve(window.L); }; s.onerror = function () { leafletReady = null; reject(new Error('تعذّر تحميل الخريطة')); };
    document.head.appendChild(s);
  });
  return leafletReady;
}
/** يركّب خريطة لاختيار مركز ونصف قطر. */
function mountMapPicker(container, init, onChange) {
  container.innerHTML = '<div id="map"></div><div class="btn-row" style="margin-top:8px"><button class="btn sm blue" id="m-me" type="button"><i class="fa-solid fa-location-crosshairs"></i> استخدم موقعي الحالي</button></div><div class="tiny" style="margin-top:6px">اضغط على الخريطة لتحديد مركز النطاق. الدائرة تبيّن المسافة المسموحة.</div>';
  loadLeaflet().then(function (L) {
    var center = init.lat ? [Number(init.lat), Number(init.lng)] : [29.3375, 47.9744];
    var map = L.map('map').setView(center, init.lat ? 17 : 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
    var marker = null, circle = null, cur = { lat: init.lat ? Number(init.lat) : null, lng: init.lng ? Number(init.lng) : null };
    function set(lat, lng) {
      cur.lat = Number(lat.toFixed(7)); cur.lng = Number(lng.toFixed(7));
      if (!marker) { marker = L.marker([cur.lat, cur.lng]).addTo(map); circle = L.circle([cur.lat, cur.lng], { radius: init.radius(), color: '#EC4899', fillOpacity: .15 }).addTo(map); }
      else { marker.setLatLng([cur.lat, cur.lng]); circle.setLatLng([cur.lat, cur.lng]); }
      onChange(cur);
    }
    if (cur.lat) set(cur.lat, cur.lng);
    map.on('click', function (e) { set(e.latlng.lat, e.latlng.lng); });
    $('m-me').onclick = function () { var b = this; busy(b, true); getPosition().then(function (c) { busy(b, false); set(c.latitude, c.longitude); map.setView([c.latitude, c.longitude], 18); toast('الدقة ' + Math.round(c.accuracy) + ' م', 'ok'); }).catch(function (e) { busy(b, false); toast(e.message, 'err'); }); };
    container._setRadius = function (r) { if (circle) circle.setRadius(r); };
    setTimeout(function () { map.invalidateSize(); }, 300);
  }).catch(function (e) { container.innerHTML = '<div class="err-box">' + esc(e.message) + '</div>'; });
}

      (s.canEditEmp && others.length ? '<div class="filters" style="margin-top:12px"><div><label>إضافة دوام خاص لموظفة</label><select id="es-pick"><option value="">— اختر —</option>' + others.map(function (x) { return '<option value="' + esc(x.id) + '">' + esc(x.name) + (x.branch ? ' (' + esc(x.branch) + ')' : '') + '</option>'; }).join('') + '</select></div></div>' : '') + '</div>';
    el.innerHTML = '<div class="info-box" style="margin-bottom:14px">أي تعديل على الدوام ينعكس فورًا على كل السجلات والتقارير والتأخيرات.</div>' + gHtml + bHtml + eHtml;
    var refresh = function () { tabSchedule(el); };
    el.querySelectorAll('[data-es]').forEach(function (b) { b.onclick = function () { empSchedForm(s.employees.filter(function (x) { return x.id === b.dataset.es; })[0], refresh); }; });
    if ($('es-pick')) $('es-pick').onchange = function () { var id = this.value; if (id) empSchedForm(s.employees.filter(function (x) { return x.id === id; })[0], refresh); };
    if ($('g-save')) $('g-save').onclick = function () { var b = this; busy(b, true); api('saveSettings', { work_start: $('g-ws').value, work_end: $('g-we').value, grace_minutes: $('g-g').value, early_grace_minutes: $('g-eg').value }).then(function () { toast('تم الحفظ', 'ok'); tabSchedule(el); }).catch(function (e) { busy(b, false); toast(e.message, 'err'); }); };
    el.querySelectorAll('[data-save]').forEach(function (btn) {
      btn.onclick = function () {
        var id = btn.dataset.save, args = { id: id };
        el.querySelectorAll('[data-b="' + id + '"]').forEach(function (i) { args[i.dataset.k] = i.value; });
        busy(btn, true);
        api('saveBranchSchedule', args).then(function () { toast('تم الحفظ', 'ok'); tabSchedule(el); }).catch(function (e) { busy(btn, false); toast(e.message, 'err'); });
      };
    });
  }).catch(failBox(el));
}

/* ----- التصدير ----- */
function tabExport(el) {
  el.innerHTML = '<div class="card"><h3>تصدير ملف Excel (CSV)</h3><div class="filters"><div><label>من</label><input type="date" id="x-from" value="' + monthStart() + '"></div><div><label>إلى</label><input type="date" id="x-to" value="' + today() + '"></div></div>' +
    '<div class="btn-row" style="margin-top:14px"><button class="btn" id="x1" style="width:auto"><i class="fa-solid fa-table"></i> السجل اليومي</button><button class="btn blue" id="x2" style="width:auto"><i class="fa-solid fa-list"></i> كل الحركات</button><button class="btn ghost" id="x3" style="width:auto"><i class="fa-solid fa-users"></i> قائمة الموظفين</button></div>' +
    '<div class="tiny" style="margin-top:10px">الملف يفتح في Excel بالعربي مباشرة. التأخيرات محسوبة على الدوام الحالي.</div></div>';
  function run(btn, action) { busy(btn, true); api(action, { from: $('x-from').value, to: $('x-to').value, branch_id: S.branch }).then(function (r) { busy(btn, false); downloadCsv(r); }).catch(function (e) { busy(btn, false); toast(e.message, 'err'); }); }
  $('x1').onclick = function () { run(this, 'exportDaily'); };
  $('x2').onclick = function () { run(this, 'exportAttendance'); };
  $('x3').onclick = function () { run(this, 'exportEmployees'); };
}

/* ----- سجل العمليات ----- */
function tabAudit(el) {
  api('audit').then(function (l) {
    el.innerHTML = '<div class="flex-between" style="margin-bottom:12px"><span class="tiny">آخر ' + l.length + ' عملية</span><button class="btn sm danger" id="au-clear"><i class="fa-solid fa-trash"></i> حذف السجل كاملًا</button></div><div class="card" style="padding:12px">' +
      (l.length ? '<div class="table-wrap"><table><thead><tr><th>الوقت</th><th>المنفّذ</th><th>العملية</th><th>التفاصيل</th></tr></thead><tbody>' + l.map(function (a) {
        return '<tr><td class="ltr">' + esc(a.time) + '</td><td>' + esc(a.actor) + '<br><span class="tiny">' + esc(a.role) + '</span></td><td>' + esc(a.action) + '</td><td style="white-space:normal;max-width:320px;font-size:12px;direction:ltr;text-align:left">' + esc(a.details) + '</td></tr>';
      }).join('') + '</tbody></table></div>' : emptyHtml('fa-shield-halved', 'السجل فاضي')) + '</div>';
    $('au-clear').onclick = function () { confirmBox('حذف سجل العمليات كاملًا؟', { danger: true, typed: 'حذف' }).then(function (v) { if (v) api('clearAudit').then(function (r) { toast('تم حذف ' + r.deleted, 'ok'); tabAudit(el); }).catch(function (e) { toast(e.message, 'err'); }); }); };
  }).catch(failBox(el));
}

/* ----- الإعدادات ----- */
function tabSettings(el) {
  api('settings').then(function (s) {
    el.innerHTML = '<div class="card"><h3>الإعدادات العامة</h3>' +
      '<div class="grid2"><div><label>اسم المؤسسة</label><input id="s-org" value="' + esc(s.org_name) + '"></div><div><label>المنطقة الزمنية</label><input id="s-tz" class="ltr" value="' + esc(s.timezone) + '"></div></div>' +
      '<div class="grid2"><div><label>نصف قطر النطاق الافتراضي (م)</label><input id="s-r" type="number" value="' + esc(s.default_radius) + '"></div><div><label>مدة الجلسة (ساعات)</label><input id="s-h" type="number" value="' + esc(s.session_hours) + '"></div></div>' +
      '<label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" id="s-out"' + (s.allow_outside === '1' ? ' checked' : '') + '> السماح بالبصمة من خارج النطاق (تُسجَّل «خارج النطاق»)</label>' +
      '<button class="btn" id="s-save" style="margin-top:14px;width:auto">حفظ الإعدادات</button>' +
      '<div class="divider"></div><a class="btn ghost sm" target="_blank" rel="noopener" href="' + esc(s.sheetUrl) + '"><i class="fa-solid fa-table"></i> فتح قاعدة البيانات (Google Sheet)</a></div>';
    $('s-save').onclick = function () {
      var b = this; busy(b, true);
      api('saveSettings', { org_name: $('s-org').value, timezone: $('s-tz').value, default_radius: $('s-r').value, session_hours: $('s-h').value, allow_outside: $('s-out').checked })
        .then(function () { toast('تم الحفظ', 'ok'); busy(b, false); lsSet(LS.org, $('s-org').value); }).catch(function (e) { busy(b, false); toast(e.message, 'err'); });
    };
  }).catch(failBox(el));
}

/* =================== البدء =================== */
(function start() {
  S.token = lsGet(LS.token);
  try { S.me = JSON.parse(lsGet(LS.me) || 'null'); } catch (e) { S.me = null; }
  getDeviceId(); getFingerprint();
  S.logo = lsGet(LS.logo) || '';
  var org = lsGet(LS.org) || 'حضانات هاي ليفيل';
  document.title = org + ' — الحضور والانصراف';
  // الإعدادات والشعار في الخلفية — الصفحة تظهر فورًا
  var cfgP = api('config').then(function (c) { S.cfg = c; lsSet(LS.org, c.org_name); document.title = c.org_name + ' — الحضور والانصراف'; }).catch(function () {});
  if (!S.logo) loadLogo();
  if (!S.token) { renderLanding(); cfgP.then(function () { var h = document.querySelector('.landing h1'); if (h && S.cfg) h.textContent = S.cfg.org_name; }); return; }
  route();
})();
</script>
</body>
</html>
